<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TokenHut – Premium Gift Card Marketplace</title>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:700,600|Poppins:400,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #fca311;
      --dark: #22223b;
      --hero-gradient: linear-gradient(125deg, #fca311 0%, #ffecce 38%, #fff 75%);
      --accent1: #fff6e6;
      --accent2: #fab95b;
      --accent3: #2953c5;
      --navbar-bg: rgba(34,34,59,0.965);
    }
    html, body { margin:0;padding:0;box-sizing: border-box;width:100%; }
    body { font-family: 'Poppins', Arial, sans-serif; background:var(--accent1); color:var(--dark);}
    a { color: var(--primary); text-decoration: none;}
    header { box-shadow:0 3px 20px #0002;width:100%;background:var(--navbar-bg);padding:0;}
    .navbar { max-width:1210px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:18px 20px 12px 14px; }
    .navbar .logo-hero { display:flex;align-items:center;font-family:'Montserrat',sans-serif;font-weight:700;font-size:1.7em;color:var(--primary);}
    .navbar .logo-wrap { width:43px;height:43px;border-radius:40%;background:var(--primary);box-shadow:0 2px 15px #fca31144;display:flex;align-items:center;justify-content:center;margin-right:10px; }
    .nav-links { display:flex;gap:28px;}
    .nav-link { color:#fff; font-weight:600; padding-bottom:2px; cursor:pointer; position:relative;transition:.15s;}
    .nav-link.active, .nav-link:hover { color:var(--primary);}
    .nav-link:after { content:""; display:block; width:0;height:2px;background:var(--primary);transition:.25s; margin:0 auto;}
    .nav-link.active:after, .nav-link:hover:after {width:100%;}
    .hero-section {
      width:100%;
      min-height:340px;
      background:var(--hero-gradient);
      display:flex;align-items:center;justify-content:center;flex-direction:column;
      text-align:center;position:relative;
      overflow:hidden;
      box-shadow:0 11px 40px #fca31115;
    }
    .hero-content { max-width:700px; padding:50px 10px 26px 10px;}
    .hero-section h1 {
      font-family:'Montserrat',sans-serif;font-size:2.6em;font-weight:700;color:var(--dark);margin:0 0 13px 0;letter-spacing:1.4px;}
    .hero-section p { font-size:1.14em;color:#463700;margin:0 0 18px 0;}
    .hero-cta { font-family:'Montserrat';background:var(--primary);color:#fff;font-size:1.1em;font-weight:700;border:none;border-radius:8px;padding:15px 46px;box-shadow:0 5px 36px #fca31155;letter-spacing:1px; transition:.17s;cursor:pointer;}
    .hero-cta:hover { background:var(--dark); color:var(--primary);}
    .trending-bar { background:var(--accent2);padding:10px 0;text-align:center;font-weight:600;letter-spacing:.6px;color:var(--dark);}
    .trending-bar span { margin:0 8px;}
    .container { max-width:1200px;margin:0 auto;padding:16px 10px;}
    .divider-title { font-family:'Montserrat';color:var(--dark);font-size:1.5em;font-weight:700;margin:30px 0 7px 0;letter-spacing:.8px; }
    .category-filters {display:flex;flex-wrap:wrap;gap:9px 19px;margin-bottom:18px;}
    .cat-btn {background:#fff;color:var(--dark);font-family:'Poppins';font-size:1em;font-weight:600;border:none;border-radius:7px;padding:10px 24px;box-shadow:0 1px 8px #fca31112;cursor:pointer;transition:background .14s,color .14s;}
    .cat-btn.active, .cat-btn:hover {background:var(--primary);color:#fff;}
    .cardlist { display:grid;grid-template-columns: repeat(auto-fit,minmax(260px,1fr));gap:32px 20px;margin:18px 0 10px 0;align-items:stretch;}
    .card {background:#fff; border-radius:18px;box-shadow:0 4px 20px #22223b13;padding:35px 18px 19px 18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;position:relative;min-height:320px;transition:box-shadow .18s,transform .12s;}
    .card:hover {box-shadow:0 12px 52px var(--primary),0 3px 16px #fff1;border:1.5px solid var(--primary);transform:scale(1.046);}
    .card-logo img{width:85px;height:auto;margin-bottom:11px;user-select:none;pointer-events:none;}
    .card-title {font-size:1.2em;color:var(--dark);font-family:'Montserrat';font-weight:700;margin-bottom:6px;text-align:center;}
    .card-region {color:var(--primary);font-size:.96em;font-weight:600;margin-bottom:5px;text-align:center;}
    .card-desc {font-size:.97em;color:#484848;margin-bottom:12px;flex:1;text-align:center;}
    .price-range {font-weight:600;margin-bottom:10px;color:#32553f;font-size:1.06em;font-family:'Montserrat';}
    .denoms {margin-bottom:6px;display:flex;justify-content:center;gap:5px;flex-wrap:wrap;}
    .denoms button {background:var(--accent2);color:var(--dark);border:none;border-radius:6px;padding:5px 13px;font-family:'Poppins';font-size:.95em;opacity:.88;cursor:default;}
    .mini-buy-btn {background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:1em;font-weight:700;letter-spacing:1.1px;font-family:'Montserrat';box-shadow:0 2px 8px var(--primary);cursor:pointer;transition:background .14s,color .14s;}
    .mini-buy-btn:hover {background:var(--dark);color:var(--primary);}
    /* Modal/checkout & overlay */
    .modal-bg {position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(19,26,41,.75);display:flex;align-items:center;justify-content:center;z-index:9999;animation:fadeInModal .45s;}
    @keyframes fadeInModal{from{opacity:0}to{opacity:1}}
    .modal-box {background:#fff;box-shadow:0 8px 44px var(--primary);border-radius:24px;max-width:440px;width:99%;text-align:center;padding:35px 16px 20px 16px;position:relative;animation:slideUp .42s cubic-bezier(.62,.2,.12,1.12) forwards;max-height:95vh;overflow-y:auto;}
    @keyframes slideUp{from{transform:translateY(60px) scale(.97);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
    .modal-logo img {width:98px;height:auto;margin-bottom:5px;}
    .modal-title {font-family:'Montserrat';font-weight:700;font-size:1.25em;margin-bottom:4px;}
    .modal-region {color:var(--primary);font-weight:700;margin-bottom:7px;}
    .modal-desc {font-size:.98em;color:#444;margin-bottom:9px;text-align:left;white-space:pre-wrap;}
    .modal-usage,.modal-tnc,.modal-disclaimer {text-align:left;font-size:.96em;color:#505050;margin-bottom:7px;padding:7px 9px;border-radius:7px;background:var(--accent1);}
    .modal-denoms {display:flex;justify-content:center;gap:8px;margin:13px 0 12px 0;flex-wrap:wrap;}
    .modal-denoms button {padding:8px 14px;border-radius:7px;font-weight:700;font-family:'Poppins';font-size:1.04em;border:none;background:linear-gradient(90deg,#ffe6ae 80%,#fca311 100%);color:var(--dark);box-shadow:0 1px 6px #fab95b33;cursor:pointer;user-select:none;}
    .modal-denoms .selected {background:var(--primary);color:#fff;}
    .modal-buy-btn {margin-top:3px;background:var(--primary);color:#fff;font-weight:700;border:none;padding:12px 27px;border-radius:10px;font-size:1.05em;box-shadow:0 2.5px 7px var(--primary);letter-spacing:1px;font-family:'Montserrat';cursor:pointer;}
    .modal-buy-btn:hover {background:var(--dark);color:var(--primary);}
    .modal-close {position:absolute;top:13px;right:15px;font-size:1.3em;font-weight:700;cursor:pointer;color:var(--dark);}
    .modal-close:hover {color:var(--primary);}
    /* About & Contact overlay */
    .page-overlay-bg {position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(34,34,59,0.83);z-index:9998;display:flex;align-items:center;justify-content:center;animation:fadeInModal .28s;}
    .page-box {background:#fff;box-shadow:0 11px 44px var(--primary);border-radius:24px;max-width:535px;width:97%;text-align:center;padding:63px 32px 36px 32px;position:relative;animation:slideUp .5s cubic-bezier(.62,.2,.12,1.12) forwards;}
    .page-box h2 {color:var(--primary);margin-top:0;margin-bottom:13px;font-family:'Montserrat';}
    .page-box p {font-size:1.07em;margin:0 auto 19px auto;color:var(--dark);}
    .contact-form input, .contact-form textarea {width:95%;margin-bottom:13px;padding:9px 12px;border-radius:7px;border:1px solid #eee;font-size:.99em;font-family:'Poppins';}
    .contact-form button {background:var(--primary);color:#fff;padding:11px 30px;border-radius:8px;font-size:1em;font-weight:700;letter-spacing:1px;font-family:'Montserrat';border:none;cursor:pointer;}
    .about-facts {text-align:left;margin:19px 0;line-height:1.7;}
    .about-facts span {display:inline-block;color:var(--primary);font-weight:600;}
    .close-overlay {position:absolute;top:16px;right:19px;font-size:1.6em;font-weight:700;cursor:pointer;color:var(--primary);}
    .close-overlay:hover{color:var(--dark);}
    @media (max-width:600px) {
      .hero-content{padding:18px 6px;}
      main{padding:5px;}
      .modal-box,.page-box{padding:14px 3px;}
      .card{padding:14px 3px;}
    }
  </style>
</head>
<body>
  <header>
    <div class="navbar">
      <div class="logo-hero">
        <span class="logo-wrap">
          <svg viewBox="0 0 43 43"><circle cx="21.5" cy="21.5" r="21.5" fill="#fca311" /><text x="21.5" y="29" text-anchor="middle" font-size="28" fill="#14213d" font-weight="bold" font-family="Montserrat">T</text></svg>
        </span>
        TokenHut
      </div>
      <div class="nav-links">
        <div class="nav-link active" onclick="navigateHome()">Home</div>
        <div class="nav-link" onclick="showOverlay('about')">About</div>
        <div class="nav-link" onclick="showOverlay('contact')">Contact</div>
      </div>
    </div>
  </header>
  <section class="hero-section" id="heroSection">
    <div class="hero-content">
      <h1>Buy Digital Gift Cards<br>From Around the World</h1>
      <p>Instant email delivery. Secure, convenient, and trusted since 2025.<br>
      Trending: <span style="color:#fca311;font-weight:600;">Apple</span>, <span style="color:#fca311;font-weight:600;">Steam</span>, <span style="color:#fca311;font-weight:600;">Amazon</span>, <span style="color:#fca311;font-weight:600;">PSN</span>, <span style="color:#fca311;font-weight:600;">Razer Gold</span>
      </p>
      <button class="hero-cta" onclick="document.getElementById('scroll_marker').scrollIntoView({behavior:'smooth'});">Shop Top Sellers</button>
      <div class="hero-animation"></div>
    </div>
  </section>
  <div class="trending-bar">Trending: <span>Apple</span><span>Steam</span><span>Amazon</span><span>PlayStation</span></div>
  <main>
    <div id="scroll_marker"></div>
    <div class="divider-title">Top Sellers This Week</div>

    <div class="category-filters" id="categoryBtns"></div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search brand, region, or category…" />
      <button onclick="handleSearch()">Search</button>
    </div>
    <div id="favorites" class="favorites" style="display:none;"></div>
    <div class="cardlist" id="giftCardGrid"></div>
  </main>
  <div id="modalBg" style="display:none;"></div>
  <div id="overlayBg" style="display:none;"></div>
  <script>
    // Brand logo images (Wikimedia/official SVG)
    const logos = {
      Amazon:'<img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon logo" />',
      Apple:'<img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple logo" />',
      PlayStation:'<img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Playstation_logo_colour.svg" alt="PlayStation logo" />',
      Xbox:'<img src="https://upload.wikimedia.org/wikipedia/commons/4/43/Xbox_logo.svg" alt="Xbox logo" />',
      UberEats:'<img src="https://upload.wikimedia.org/wikipedia/commons/c/c5/Uber_Eats_2020_logo.svg" alt="Uber Eats logo" />',
      Walmart:'<img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/Walmart_logo.svg" alt="Walmart logo" />',
      Steam:'<img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg" alt="Steam logo" />',
      Spotify:'<img src="https://upload.wikimedia.org/wikipedia/commons/2/26/Spotify_logo_with_text.svg" alt="Spotify logo" />',
      Netflix:'<img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix logo" />',
      GooglePlay:'<img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play logo" />',
      Valorant:'<img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/Valorant_logo_-_pink_color_version.svg" alt="Valorant logo" style="height: 60px; width:auto;"/>',
      Roblox:'<img src="https://upload.wikimedia.org/wikipedia/commons/2/20/Roblox_logo.svg" alt="Roblox logo" style="height: 60px; width:auto;"/>',
      Fortnite:'<img src="https://upload.wikimedia.org/wikipedia/commons/6/69/Fortnite_logo.svg" alt="Fortnite logo" style="height: 40px; width:auto;"/>',
      Nike:'<img src="https://upload.wikimedia.org/wikipedia/commons/a/a6/Logo_NIKE.svg" alt="Nike logo" style="height: 40px; width:auto;"/>',
      HM:'<img src="https://upload.wikimedia.org/wikipedia/commons/5/56/H%26M-Logo.svg" alt="H&M logo" style="height: 40px; width:auto;"/>',
      Zalando:'<img src="https://upload.wikimedia.org/wikipedia/commons/2/2b/Zalando-Logo.svg" alt="Zalando logo" style="height: 60px; width:auto;"/>',
      Target:'<img src="https://upload.wikimedia.org/wikipedia/commons/9/9a/Logo_of_Target.svg" alt="Target logo" style="height: 40px; width:auto;"/>',
      Disney:'<img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Disney_wordmark.svg" alt="Disney logo" style="height: 40px; width:auto;"/>',
      Starbucks:'<img src="https://upload.wikimedia.org/wikipedia/sco/4/45/Starbucks_Coffee_Logo.svg" alt="Starbucks logo" style="height: 40px; width:auto;"/>',
      DoorDash:'<img src="https://upload.wikimedia.org/wikipedia/commons/4/4d/DoorDash_logo.svg" alt="DoorDash logo" style="height: 40px; width:auto;"/>',
    };

    const cards = [
      // Gaming
      {brand:"Xbox",region:"USA",icon:"Xbox",category:"Gaming",denominations:["$10","$25","$50"],description:"Games, subs, and content on Xbox Live.",price:"$10 - $50",usage:"Redeem on Xbox or microsoft.com.",terms:"USA only.",disclaimer:"Region-matched codes only."},
      {brand:"PlayStation",region:"USA",icon:"PlayStation",category:"Gaming",denominations:["$10","$25","$50","$100"],description:"Wallet for games, DLC, movies.",price:"$10 - $100",usage:"Redeem in PlayStation Store.",terms:"Region locked.",disclaimer:"Match card to PSN region."},
      {brand:"Steam",region:"Global",icon:"Steam",category:"Gaming",denominations:["$20","$50","$100"],description:"PC games and in-game content.",price:"$20 - $100",usage:"Redeem Steam client or web.",terms:"Global code.",disclaimer:"See Steam policy."},
      {brand:"Valorant",region:"USA",icon:"Valorant",category:"Gaming",denominations:["$10","$25","$50"],description:"Unlock Valorant skins/content.",price:"$10 - $50",usage:"Redeem at Riot Games.",terms:"US region.",disclaimer:"Use on matching account."},
      {brand:"Roblox",region:"Global",icon:"Roblox",category:"Gaming",denominations:["$10","$25","$50"],description:"Buy Robux/memberships on Roblox.",price:"$10 - $50",usage:"Redeem on roblox.com.",terms:"World-wide.",disclaimer:"Not liable for lost codes."},
      {brand:"Fortnite",region:"USA",icon:"Fortnite",category:"Gaming",denominations:["$15","$25","$50"],description:"V-Bucks for Fortnite skins.",price:"$15 - $50",usage:"Redeem on Epic Games.",terms:"US region.",disclaimer:"V-bucks not refundable."},
      // Shopping
      {brand:"Amazon",region:"USA",icon:"Amazon",category:"Shopping",denominations:["$25","$50","$100","$200"],description:"Electronics, fashion, groceries.",price:"$25 - $200",usage:"Redeem at checkout.",terms:"Valid 10 years US.",disclaimer:"Lost cards not replaced."},
      {brand:"Walmart",region:"USA",icon:"Walmart",category:"Shopping",denominations:["$25","$50","$100"],description:"Groceries, tech, or clothing.",price:"$25 - $100",usage:"Online or Walmart store.",terms:"No expiry.",disclaimer:"Refunds per Walmart policy."},
      {brand:"Target",region:"USA",icon:"Target",category:"Shopping",denominations:["$25","$50","$100"],description:"Shop at Target stores & online.",price:"$25 - $100",usage:"Redeem at Target or online.",terms:"No cash redemption.",disclaimer:"Check Target policy."},
      {brand:"GooglePlay",region:"USA",icon:"GooglePlay",category:"Shopping",denominations:["$10","$25","$50"],description:"Buy apps, games, movies for Android.",price:"$10 - $50",usage:"Redeem on Google Play.",terms:"US region.",disclaimer:"Google not liable."},
      // Food/Restaurant
      {brand:"UberEats",region:"USA",icon:"UberEats",category:"Food",denominations:["$25","$50","$100"],description:"Order food from restaurants.",price:"$25 - $100",usage:"Redeem in Uber Eats app.",terms:"US only.",disclaimer:"Use in purchase country."},
      {brand:"Starbucks",region:"USA",icon:"Starbucks",category:"Food",denominations:["$15","$25","$50"],description:"Cafe drinks/snacks at Starbucks.",price:"$15 - $50",usage:"Scan/app at stores.",terms:"No expiry.",disclaimer:"Refunds per Starbucks."},
      {brand:"DoorDash",region:"USA",icon:"DoorDash",category:"Food",denominations:["$10","$25","$50"],description:"Order food delivery.",price:"$10 - $50",usage:"In app/website.",terms:"No cash.",disclaimer:"See DoorDash T&C."},
      // Fashion
      {brand:"Nike",region:"USA",icon:"Nike",category:"Fashion",denominations:["$25","$50","$100"],description:"Sportswear, shoes at Nike.",price:"$25 - $100",usage:"Redeem at Nike.com/store.",terms:"Not for cash.",disclaimer:"Lost cards not refundable."},
      {brand:"HM",region:"Europe",icon:"HM",category:"Fashion",denominations:["€25","€50","€100"],description:"Trendy clothing from H&M.",price:"€25 - €100",usage:"Use in store/online.",terms:"Valid in Europe.",disclaimer:"See H&M policies."},
      {brand:"Zalando",region:"Europe",icon:"Zalando",category:"Fashion",denominations:["€25","€50","€100"],description:"Fashion shopping Zalando.",price:"€25 - €100",usage:"Redeem at Zalando.de.",terms:"Europe.",disclaimer:"See Zalando info."},
      // Entertainment
      {brand:"Spotify",region:"Global",icon:"Spotify",category:"Entertainment",denominations:["$10","$25","$50"],description:"Music streaming subscriptions.",price:"$10 - $50",usage:"Redeem in Spotify app.",terms:"Global.",disclaimer:"One-time code only."},
      {brand:"Netflix",region:"Global",icon:"Netflix",category:"Entertainment",denominations:["$15","$25","$50"],description:"Movies and series streaming.",price:"$15 - $50",usage:"Apply to Netflix account.",terms:"Worldwide, balance does not expire.",disclaimer:"Netflix not liable for lost code."},
      {brand:"Disney",region:"USA",icon:"Disney",category:"Entertainment",denominations:["$25","$50","$100"],description:"Merch, parks & shopdisney.com.",price:"$25 - $100",usage:"Disney stores, parks, shop.",terms:"No expiry US.",disclaimer:"See Disney policy."},
      {brand:"Apple",region:"USA",icon:"Apple",category:"Entertainment",denominations:["$10","$25","$50","$100"],description:"App Store, Music, Devices & more.",price:"$10 - $100",usage:"Redeem Apple ID online/device.",terms:"US only.",disclaimer:"Lost cards not replaced."}
    ];

    const categories = ["All","Gaming","Fashion","Shopping","Food","Entertainment"];
    let selectedCategory = "All";
    let filteredList = cards.slice();
    let favorites = [];

    function highlightNav(where) {
      document.querySelectorAll(".nav-link").forEach(el=>el.classList.remove("active"));
      if(where==="home") document.querySelectorAll(".nav-link")[0].classList.add("active");
      else if(where==="about") document.querySelectorAll(".nav-link")[1].classList.add("active");
      else if(where==="contact") document.querySelectorAll(".nav-link")[2].classList.add("active");
    }

    function renderCategories() {
      const catDiv = document.getElementById("categoryBtns");
      catDiv.innerHTML = categories.map(cat=>
        `<button class="cat-btn${cat===selectedCategory?" active":""}" onclick="selectCategory('${cat}')">${cat}</button>`).join('');
    }
    function selectCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      renderGrid();
    }
    function renderFavorites() {
      const favDiv = document.getElementById("favorites");
      favDiv.innerHTML = "";
      if (favorites.length === 0) { favDiv.style.display="none"; return; }
      favDiv.style.display="";
      favDiv.innerHTML = "<b>Favorites:</b> ";
      favorites.forEach(idx=>{
        const card = cards[idx];
        favDiv.innerHTML += `<span class="fav-chip" onclick="openModal(${idx})">${logos[card.icon]||""} ${card.brand}</span>`;
      });
    }
    function handleSearch() {
      const v = document.getElementById("searchInput").value.trim().toLowerCase();
      if(!v) { filteredList = cards.slice(); renderGrid(); return; }
      filteredList = cards.filter(c=>
        c.brand.toLowerCase().includes(v) ||
        c.region.toLowerCase().includes(v) ||
        c.category.toLowerCase().includes(v) ||
        (c.description && c.description.toLowerCase().includes(v))
      );
      renderGrid();
    }
    document.getElementById("searchInput").addEventListener("input", handleSearch);

    function renderGrid() {
      const grid = document.getElementById("giftCardGrid");
      grid.innerHTML = '';
      let finalList = selectedCategory==="All" ? filteredList : filteredList.filter(c=>c.category===selectedCategory);
      if(finalList.length===0){
        grid.innerHTML = `<div style="padding:45px;font-size:1.16em;color:#c94d24;text-align:center;grid-column:1/-1">No cards match your filter.</div>`;
      }
      finalList.forEach((card, idx) => {
        let globalIdx = cards.indexOf(card);
        grid.innerHTML += `
          <div class="card" tabindex="0" style="animation-delay:${idx*.11}s;">
            <div class="card-logo">${logos[card.icon]||''}</div>
            <div class="card-title">${card.brand}</div>
            <div class="card-region">${card.region}</div>
            <div class="price-range">${card.price || ""}</div>
            <div class="card-desc">${card.description}</div>
            <div class="denoms">
              ${card.denominations.map(d=>`<button disabled>${d}</button>`).join('')}
            </div>
            <button class="mini-buy-btn" onclick="openModal(${globalIdx});return false;">Shop Now</button>
            <button class="mini-buy-btn" style="margin-top:7px;background:var(--accent3);color:#fff;border:none" onclick="toggleFavorite(${globalIdx});event.stopPropagation();return false;">
              ${favorites.includes(globalIdx)?"♥":"♡"} Favorite
            </button>
          </div>
        `;
      });
      renderFavorites();
    }
    function toggleFavorite(idx) {
      const i = favorites.indexOf(idx);
      if(i!==-1) favorites.splice(i,1);
      else favorites.push(idx);
      renderGrid();
    }
    function openModal(idx) {
      const card = cards[idx];
      let selectedDenom = card.denominations[0];
      let denomsHtml = card.denominations.map((d,i)=>`<button class="${d===selectedDenom?'selected':''}" onclick="selectModalDenom('${d}',${idx})">${d}</button>`).join('');
      let favBtnText = favorites.includes(idx)? "Remove from Favorites" : "Add to Favorites";
      document.getElementById("modalBg").innerHTML = `
        <div class="modal-bg" onclick="closeModal(event)">
          <div class="modal-box" onclick="event.stopPropagation();">
            <div class="modal-logo">${logos[card.icon]||""}</div>
            <div class="modal-title">${card.brand} Gift Card</div>
            <div class="modal-region">${card.category} • ${card.region}</div>
            <div class="modal-desc">${card.description}</div>
            <div class="modal-usage"><strong>How & Where to Use:</strong><br>${card.usage}</div>
            <div class="modal-denoms" id="denomBtns">${denomsHtml}</div>
            <button class="modal-buy-btn" id="buyNowBtn" onclick="simulateBuy('${card.brand}',window.selectedDenom)">Buy Now (${selectedDenom})</button>
            <button class="modal-buy-btn" style="background:#fff;color:var(--primary);border:1px solid #ffc116;margin-top:11px" onclick="toggleFavoriteModal(${idx})">${favBtnText}</button>
            <div class="modal-tnc"><strong>Terms & Conditions:</strong><br>${card.terms}</div>
            <div class="modal-disclaimer"><strong>Disclaimer:</strong> ${card.disclaimer}</div>
            <span class="modal-close" onclick="closeModal(event)">&times;</span>
          </div>
        </div>
      `;
      document.getElementById("modalBg").style.display = '';
      window.selectedDenom = selectedDenom;
      window.modalIndex = idx;
    }
    function selectModalDenom(denom, idx) {
      window.selectedDenom = denom;
      window.modalIndex = idx;
      const buttons = document.querySelectorAll('.modal-denoms button');
      buttons.forEach(b => b.classList.remove('selected'));
      buttons.forEach(b => { if(b.textContent === denom) b.classList.add('selected'); });
      const buyBtn = document.getElementById('buyNowBtn');
      if (buyBtn) buyBtn.textContent = `Buy Now (${denom})`;
    }
    function closeModal(e) {
      if (!e || (e && e.target.classList.contains('modal-bg')) || e.type==='click') {
        document.getElementById("modalBg").innerHTML = "";
        document.getElementById("modalBg").style.display = "none";
      }
    }
    function simulateBuy(brand, denom) {
      alert(`You selected ${brand} (${denom}).\nProceeding to checkout (Comming Soon)`);
      closeModal();
    }
    function toggleFavoriteModal(idx) {
      toggleFavorite(idx);
      openModal(idx);
    }

    // SPA navigation for About & Contact 
    function navigateHome() {
      location.hash = "#home";
      document.getElementById("overlayBg").style.display = "none";
      highlightNav("home");
    }
    function showOverlay(type) {
      highlightNav(type);
      let html = "";
      if(type==="about") html = `<div class="page-overlay-bg" onclick="closeOverlay(event)"><div class="page-box" onclick="event.stopPropagation();">
        <span class="close-overlay" onclick="closeOverlay(event)">&times;</span>
        <h2>About TokenHut</h2>
        <p>
        <span style="font-weight:bold;color:#22223b;">Since 2020</span>, TokenHut has been focused on helping customers around the world access all the most popular digital and gaming gift cards in one secure, simple storefront.<br>
        <div class="about-facts">
          <span>✓</span> Fast delivery worldwide (email + instant access)<br>
          <span>✓</span> Curated and trending sellers weekly<br>
          <span>✓</span> Trusted by 25k+ global customers<br>
          <span>✓</span> 100% refund policy on invalid codes<br>
          <span>✓</span> 24/7 expert live chat support<br>
        </div>
        Our mission: make gifting, gaming, and shopping borderless and hassle-free for digital citizens everywhere!
        </p>
      </div></div>`;
      else html = `<div class="page-overlay-bg" onclick="closeOverlay(event)"><div class="page-box" onclick="event.stopPropagation();">
        <span class="close-overlay" onclick="closeOverlay(event)">&times;</span>
        <h2>Contact Us</h2>
        <p>We're here to help! Fill out this form and you'll receive a reply in 1–12 hours.</p>
        <form class="contact-form" onsubmit="contactFormSubmit(event)">
          <input type="text" placeholder="Your Name" id="name" required><br>
          <input type="email" placeholder="Your Email" id="email" required><br>
          <textarea rows="4" placeholder="How can we help you?" id="msg" required></textarea><br>
          <button type="submit">Send Message</button>
        </form>
        <p style="font-size:.97em;margin-top:17px;color:#9d7c43;">Or email us: <a href="mailto:support@tokenhut.com">support@tokenhut.com</a></p>
      </div></div>`;
      document.getElementById("overlayBg").innerHTML = html;
      document.getElementById("overlayBg").style.display="flex";
    }
    function closeOverlay(e) {
      if (!e || (e && e.target.classList.contains('page-overlay-bg')) || e.type==='click') {
        document.getElementById("overlayBg").innerHTML = "";
        document.getElementById("overlayBg").style.display = "none";
        highlightNav("home");
      }
    }
    function contactFormSubmit(event) {
      event.preventDefault();
      alert("Message sent! We'll reply within 1–12 hours.");
      closeOverlay();
    }

    // Initial
    renderCategories();
    renderGrid();
    highlightNav("home");
    window.selectCategory = selectCategory;
    window.openModal = openModal;
    window.selectModalDenom = selectModalDenom;
    window.simulateBuy = simulateBuy;
    window.closeModal = closeModal;
    window.handleSearch = handleSearch;
    window.toggleFavorite = toggleFavorite;
    window.toggleFavoriteModal = toggleFavoriteModal;
    window.navigateHome = navigateHome;
    window.showOverlay = showOverlay;
    window.closeOverlay = closeOverlay;
    window.contactFormSubmit = contactFormSubmit;
  </script>
